<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072a20" />
      <stop offset="100%" stop-color="#02130e" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="favGoldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#favEmerald)" stroke="url(#favGold)" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="32" cy="32" r="26.5" stroke="#10b981" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Crescent Moon -->
  <path d="M37 13.5C27 15 19.5 23 19.5 33.5C19.5 44 27.5 52 38 52.5C32.5 50 28.5 44.5 28.5 38C28.5 28.5 34.5 20.5 37 13.5Z" 
        fill="url(#favGold)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" />

  <!-- Mosque Dome Silhouette inside crescent -->
  <!-- Base -->
  <path d="M29 45H47V43C47 43 45 42 38 42C31 42 29 43 29 43V45Z" fill="url(#favGold)" />
  <!-- Dome arch -->
  <path d="M30 42C30 33 38 27.5 38 27.5C38 27.5 46 33 46 42H30Z" fill="url(#favGold)" />
  <!-- Dome finial / spire -->
  <line x1="38" y1="27.5" x2="38" y2="24" stroke="url(#favGold)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="38" cy="23.2" r="1.2" fill="#fffbeb" />

  <!-- Minaret on Right -->
  <rect x="47.5" y="32" width="3" height="13" rx="0.5" fill="url(#favGold)" />
  <path d="M47 32L49 26.5L51 32H47Z" fill="url(#favGold)" />
  <line x1="49" y1="26.5" x2="49" y2="24.5" stroke="url(#favGold)" stroke-width="1.2" stroke-linecap="round" />

  <!-- 5 Obligatory Prayer Stars in Arch -->
  <!-- Star 1: Fajr -->
  <circle cx="21" cy="24" r="1.4" fill="url(#favGoldGlow)" />
  <!-- Star 2: Dhuhr -->
  <circle cx="27" cy="18" r="1.6" fill="url(#favGoldGlow)" />
  <!-- Star 3: Asr (Apex) -->
  <circle cx="35" cy="15" r="1.8" fill="url(#favGoldGlow)" />
  <!-- Star 4: Maghrib -->
  <circle cx="43" cy="17" r="1.6" fill="url(#favGoldGlow)" />
  <!-- Star 5: Isha -->
  <circle cx="50" cy="22" r="1.4" fill="url(#favGoldGlow)" />
</svg>
